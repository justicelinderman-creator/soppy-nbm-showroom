name: Public showroom health check
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showroom-health
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout audited public site source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate live routes, internal links, stylesheets and prelaunch safety
        run: python3 scripts/site_health.py
